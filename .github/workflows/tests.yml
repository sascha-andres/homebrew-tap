# brew tap-new uses this file to generate a PR test workflow for the new tap
name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test-bot:
    strategy:
      matrix:
        os: [ macos-26 ]
        include:
          - os: ubuntu-latest
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(toJSON(matrix.container)) }} # zizmor: ignore[unpinned-images]
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@a657b8b0cd35d0f65cce41fce9b24cf054b49869 # 2026.08.24.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      # Not `brew test-bot --only-tap-syntax`: it runs `brew readall --os=all
      # --arch=all`, which simulates macOS+Intel even though these casks are
      # intentionally arm64-only on macOS. Homebrew's readall only skips that
      # combo via `depends_on macos:` (an OS-version bound), never via
      # `depends_on arch:`, so an arm64-only cask can't satisfy it. `--no-simulate`
      # checks the runner's actual OS/arch instead, which is what we can support.
      - name: Style-check casks
        run: brew style --cask --except-cops=Cask/StanzaOrder,Cask/StanzaGrouping,Layout/EmptyLinesAroundBlockBody "${{ steps.set-up-homebrew.outputs.tap-name }}"

      - name: Readall casks
        run: brew readall --aliases --no-simulate "${{ steps.set-up-homebrew.outputs.tap-name }}"

      - name: Audit casks
        run: brew audit --cask --strict --tap="${{ steps.set-up-homebrew.outputs.tap-name }}"

      - name: Install casks
        if: github.event_name == 'pull_request'
        run: |
          brew install --cask "${{ steps.set-up-homebrew.outputs.tap-name }}/git-c"
          brew install --cask "${{ steps.set-up-homebrew.outputs.tap-name }}/git-cl"
          brew install --cask "${{ steps.set-up-homebrew.outputs.tap-name }}/godl"
